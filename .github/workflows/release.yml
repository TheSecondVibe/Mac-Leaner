name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

defaults:
  run:
    shell: bash

jobs:
  release:
    name: Build and publish release
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Show toolchain versions
        run: |
          swift --version
          sw_vers

      - name: Test
        run: swift test

      - name: Set version from tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [[ -z "$VERSION" ]]; then
            echo "::error::Tag '${GITHUB_REF_NAME}' does not contain a version (expected something like v1.2.3)."
            exit 1
          fi
          echo "Releasing Mac-Leaner ${VERSION}"
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"

      - name: Build app bundle
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: ./scripts/build_app.sh

      - name: Package release assets
        run: |
          ditto -c -k --keepParent build/Mac-Leaner.app "Mac-Leaner-${VERSION}.zip"
          shasum -a 256 "Mac-Leaner-${VERSION}.zip" > "Mac-Leaner-${VERSION}.zip.sha256"
          cat "Mac-Leaner-${VERSION}.zip.sha256"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          ZIP="Mac-Leaner-${VERSION}.zip"
          CHECKSUM="Mac-Leaner-${VERSION}.zip.sha256"
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            echo "Release ${GITHUB_REF_NAME} already exists; uploading assets."
            gh release upload "$GITHUB_REF_NAME" "$ZIP" "$CHECKSUM" --clobber
          else
            echo "Creating release ${GITHUB_REF_NAME}."
            gh release create "$GITHUB_REF_NAME" "$ZIP" "$CHECKSUM" --title "Mac-Leaner ${VERSION}" --generate-notes
          fi
