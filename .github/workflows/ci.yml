name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  build:
    name: Build, test and package
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Show toolchain versions
        run: |
          swift --version
          sw_vers

      - name: Build
        run: swift build

      - name: Test
        run: swift test

      - name: Build app bundle
        run: ./scripts/build_app.sh

      - name: Zip app bundle
        run: ditto -c -k --keepParent build/Mac-Leaner.app Mac-Leaner.zip

      - name: Upload app bundle
        uses: actions/upload-artifact@v4
        with:
          name: Mac-Leaner-app
          path: Mac-Leaner.zip
          retention-days: 14
          if-no-files-found: error
